services:
  - type: web
    name: finance4life
    runtime: python
    plan: free
    # Install dependencies.
    buildCommand: "pip install -r requirements.txt"
    # Bind to the port Render provides via $PORT (shell-form with fallback).
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      # Persist user data (accounts, progress, wallets) in managed Postgres so
      # it survives redeploys. Lesson content is re-seeded from the committed
      # source PDFs on startup, so slides are always present.
      - key: DATABASE_URL
        fromDatabase:
          name: finance4life-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: finance4life-db
    plan: free

